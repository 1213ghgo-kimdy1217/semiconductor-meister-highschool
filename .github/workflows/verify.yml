name: Verify wafer console

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wafer-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify browser bundle contains no privileged keys
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) await walk(path);
              else if (/\.(?:js|html|css|json|map)$/.test(path)) {
                const source = await readFile(path, 'utf8');
                if (/sb_secret_[A-Za-z0-9_-]+/.test(source) || /SUPABASE_DB_PASSWORD/.test(source)) {
                  throw new Error('Privileged credential marker found in browser output');
                }
                for (const token of source.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g) ?? []) {
                  try {
                    const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
                    if (payload.role === 'service_role') throw new Error('Privileged JWT found in browser output');
                  } catch (error) {
                    if (error instanceof Error && error.message === 'Privileged JWT found in browser output') throw error;
                  }
                }
              }
            }
          }
          await walk('dist');
          console.log('PASS browser credential scan (values are never printed)');
          NODE
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser scenarios with simulated devices and cloud
        run: |
          npm run dev -- --strictPort > /tmp/wafer-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 100; attempt++) {
            try {
              if ((await fetch('http://localhost:5173')).ok) { ready = true; break; }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 200));
          }
          if (!ready) throw new Error('Development server did not start');
          NODE
          node tests/e2e/sim-flow.cjs
          node tests/e2e/cloud-flow.cjs
